<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway - RideNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo-container">
                <svg class="moving-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1 .4-1 1v3H3c-.6 0-1 .4-1 1v2c0 .6.4 1 1 1h2"/>
                    <circle cx="7" cy="17" r="2"/>
                    <circle cx="17" cy="17" r="2"/>
                </svg>
                <a href="index.html" class="logo">Ride<span>Nova</span></a>
            </div>
            <ul class="nav-links" id="nav-links">
                <!-- Dynamically populated by script.js -->
            </ul>
        </div>
    </header>

    <div class="container" style="max-width: 500px;">
        <div class="card">
            <h2>Complete Payment</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Confirm your transaction details below to finish the ride payment.</p>

            <div id="loading-booking" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                Fetching booking information...
            </div>

            <div id="payment-details-box" style="display: none;">
                <!-- Booking details -->
                <div class="card" style="background: rgba(255, 255, 255, 0.02); padding: 1.25rem; border-color: rgba(255, 255, 255, 0.05); margin-bottom: 1.5rem;">
                    <p style="margin-bottom: 0.5rem;"><strong>Booking ID:</strong> <span id="booking-id-text">#0</span></p>
                    <p style="margin-bottom: 0.5rem;"><strong>Passenger:</strong> <span id="passenger-text">-</span></p>
                    <p style="margin-bottom: 0.5rem;"><strong>Route:</strong> <span id="route-text">-</span></p>
                    <p style="margin-bottom: 0.5rem;"><strong>Driver:</strong> <span id="driver-text">-</span></p>
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 0.75rem 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong style="font-size: 1.1rem;">Total Fare:</strong>
                        <strong style="font-size: 1.4rem; color: var(--accent);" id="fare-text">₹0.00</strong>
                    </div>
                </div>

                <form id="payment-form">
                    <div class="form-group">
                        <label for="payment_method">Select Payment Option</label>
                        <select class="form-control" id="payment_method" required>
                            <option value="UPI">UPI (Unified Payments Interface)</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Wallet">Digital Wallet (Apple Pay/GPay)</option>
                            <option value="Cash">Cash to Driver</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">Confirm & Pay</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const user = getSessionUser();
        if (!user) {
            showNotification('Please log in to complete your payment.', 'error');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        }

        // Parse query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = parseInt(urlParams.get('booking_id'));

        let bookingRecord = null;

        async function loadPaymentDetails() {
            if (!bookingId) {
                document.getElementById('loading-booking').innerHTML = `
                    <p style="color: var(--danger);">No booking ID provided in URL.</p>
                    <p style="font-size: 0.9rem; margin-top: 1rem;"><a href="ride_history.html" style="color: var(--primary);">Go to Ride History</a></p>
                `;
                return;
            }

            try {
                const bookings = await fetchAPI('/bookings/');
                bookingRecord = bookings.find(b => b.booking_id === bookingId);

                if (!bookingRecord) {
                    document.getElementById('loading-booking').innerHTML = `
                        <p style="color: var(--danger);">Booking record not found.</p>
                        <p style="font-size: 0.9rem; margin-top: 1rem;"><a href="ride_history.html" style="color: var(--primary);">Go to Ride History</a></p>
                    `;
                    return;
                }

                // Populate elements
                document.getElementById('booking-id-text').textContent = `#${bookingRecord.booking_id}`;
                document.getElementById('passenger-text').textContent = bookingRecord.customer_name;
                document.getElementById('route-text').textContent = `${bookingRecord.pickup_location} → ${bookingRecord.drop_location}`;
                document.getElementById('driver-text').textContent = bookingRecord.driver_name;
                document.getElementById('fare-text').textContent = `₹${parseFloat(bookingRecord.fare).toFixed(2)}`;

                // Swap loading spinner with form
                document.getElementById('loading-booking').style.display = 'none';
                document.getElementById('payment-details-box').style.display = 'block';

            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!bookingRecord) return;

            const paymentMethod = document.getElementById('payment_method').value;
            const txnId = 'TXN' + Date.now() + Math.floor(100 + Math.random() * 900);
            const today = new Date().toISOString().split('T')[0];

            const paymentPayload = {
                booking_id: bookingRecord.booking_id,
                customer_name: bookingRecord.customer_name,
                amount: bookingRecord.fare,
                payment_method: paymentMethod,
                payment_status: 'Success',
                transaction_id: txnId,
                payment_date: today
            };

            try {
                // Post Payment
                const payment = await fetchAPI('/payments/add/', 'POST', paymentPayload);
                if (payment && payment.payment_id) {
                    showNotification('Payment successful! Processing receipt...');

                    // Automatically update booking status to Completed if not already finished
                    if (bookingRecord.ride_status !== 'Completed' && bookingRecord.ride_status !== 'Cancelled') {
                        try {
                            const updatePayload = {
                                customer_name: bookingRecord.customer_name,
                                driver_name: bookingRecord.driver_name,
                                pickup_location: bookingRecord.pickup_location,
                                drop_location: bookingRecord.drop_location,
                                booking_date: bookingRecord.booking_date,
                                fare: bookingRecord.fare,
                                ride_status: 'Completed'
                            };
                            await fetchAPI(`/bookings/update/${bookingRecord.booking_id}/`, 'PUT', updatePayload);
                        } catch (err) {
                            console.warn("Could not update booking status automatically", err);
                        }
                    }

                    setTimeout(() => {
                        window.location.href = 'customer_dashboard.html';
                    }, 2000);
                }
            } catch (err) {
                console.error(err);
            }
        });

        document.addEventListener('DOMContentLoaded', loadPaymentDetails);
    </script>
</body>
</html>
