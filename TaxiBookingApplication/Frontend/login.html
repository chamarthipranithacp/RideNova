<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RideNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo-container">
                <svg class="moving-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1 .4-1 1v3H3c-.6 0-1 .4-1 1v2c0 .6.4 1 1 1h2"/>
                    <circle cx="7" cy="17" r="2"/>
                    <circle cx="17" cy="17" r="2"/>
                </svg>
                <a href="index.html" class="logo">Ride<span>Nova</span></a>
            </div>
            <ul class="nav-links" id="nav-links">
                <!-- Dynamically populated by script.js -->
            </ul>
        </div>
    </header>

    <!-- Login Form Section -->
    <div class="form-container-page">
        <div class="card form-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.9rem;">Sign in to your GoTaxi account</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="role">Sign In As</label>
                    <select class="form-control" id="role" required onchange="onRoleChange()">
                        <option value="customer">Customer</option>
                        <option value="driver">Driver</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email" id="email-label">Email Address</label>
                    <input type="text" class="form-control" id="email" placeholder="email@gmail.com" required>
                </div>

                <div class="form-group" id="password-group">
                    <label for="credential" id="credential-label">Password</label>
                    <input type="password" class="form-control" id="credential" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" style="margin-top: 1rem;">Sign In</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register Here</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function onRoleChange() {
            const role = document.getElementById('role').value;
            const emailLabel = document.getElementById('email-label');
            const emailInput = document.getElementById('email');
            const passwordGroup = document.getElementById('password-group');
            const credentialLabel = document.getElementById('credential-label');
            const credentialInput = document.getElementById('credential');

            if (role === 'admin') {
                emailLabel.textContent = 'Admin Username';
                emailInput.placeholder = 'admin';
                passwordGroup.style.display = 'block';
                credentialLabel.textContent = 'Password';
                credentialInput.placeholder = '••••••••';
                credentialInput.type = 'password';
            } else if (role === 'driver') {
                emailLabel.textContent = 'Email Address';
                emailInput.placeholder = 'ramesh@gmail.com';
                passwordGroup.style.display = 'block';
                credentialLabel.textContent = 'Phone Number';
                credentialInput.placeholder = '9988776655';
                credentialInput.type = 'text';
            } else {
                emailLabel.textContent = 'Email Address';
                emailInput.placeholder = 'rahul@gmail.com';
                passwordGroup.style.display = 'block';
                credentialLabel.textContent = 'Password';
                credentialInput.placeholder = '••••••••';
                credentialInput.type = 'password';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value.trim();
            const credential = document.getElementById('credential').value.trim();

            if (role === 'admin') {
                try {
                    const admins = await fetchAPI('/admins/');
                    const admin = admins.find(a => a.email.toLowerCase() === email.toLowerCase() && a.password === credential);
                    if (admin) {
                        setSessionUser({
                            role: 'admin',
                            name: admin.full_name,
                            id: admin.admin_id,
                            email: admin.email
                        });
                        showNotification('Admin login successful!');
                        setTimeout(() => {
                            window.location.href = 'admin_dashboard.html';
                        }, 1000);
                    } else {
                        showNotification('Invalid admin credentials!', 'error');
                    }
                } catch (err) {
                    console.error(err);
                }
                return;
            }

            try {
                if (role === 'customer') {
                    const customers = await fetchAPI('/customers/');
                    const user = customers.find(c => c.email.toLowerCase() === email.toLowerCase() && c.password === credential);
                    if (user) {
                        setSessionUser({
                            role: 'customer',
                            name: user.full_name,
                            id: user.customer_id,
                            email: user.email
                        });
                        showNotification('Login successful!');
                        setTimeout(() => {
                            window.location.href = 'customer_dashboard.html';
                        }, 1000);
                    } else {
                        showNotification('Invalid email or password!', 'error');
                    }
                } else if (role === 'driver') {
                    const drivers = await fetchAPI('/drivers/');
                    const driver = drivers.find(d => d.email.toLowerCase() === email.toLowerCase() && d.phone === credential);
                    if (driver) {
                        setSessionUser({
                            role: 'driver',
                            name: driver.driver_name,
                            id: driver.driver_id,
                            email: driver.email
                        });
                        showNotification('Login successful!');
                        setTimeout(() => {
                            window.location.href = 'drivers.html';
                        }, 1000);
                    } else {
                        showNotification('Invalid driver email or phone combination!', 'error');
                    }
                }
            } catch (err) {
                console.error(err);
            }
        });

        // Run on page load
        onRoleChange();
    </script>
</body>
</html>
